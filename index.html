<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatat Keuangan Sederhana</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .balance-box { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #e9ecef; }
        .balance-box h3 { margin: 0; font-size: 14px; color: #6c757d; }
        .balance-box span { font-size: 24px; font-weight: bold; color: #2b2b2b; }
        .inc-exp-container { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .inc-exp-container div { flex: 1; text-align: center; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e9ecef; }
        .inc-exp-container div.income h4 { color: #2ecc71; }
        .inc-exp-container div.expense h4 { color: #e74c3c; }
        h4 { margin: 0 0 5px 0; font-size: 13px; }
        p { margin: 0; font-size: 16px; font-weight: bold; }
        .form-control { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #495057; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .list { list-style: none; padding: 0; margin: 20px 0 0 0; max-height: 200px; overflow-y: auto; }
        .list li { background: #fff; display: flex; justify-content: space-between; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-right: 5px solid #2ecc71; box-shadow: 0 2px 5px rgba(0,0,0,0.02); position: relative; }
        .list li.minus { border-right-color: #e74c3c; }
        .delete-btn { position: absolute; background: #e74c3c; color: white; border: none; padding: 2px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; right: -25px; top: 12px; display: none; }
        .list li:hover .delete-btn { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>SakuKu - Keuangan</h2>

    <div class="balance-box">
        <h3>SALDO SAAT INI</h3>
        <span id="balance">Rp 0</span>
    </div>

    <div class="inc-exp-container">
        <div class="income">
            <h4>Pemasukan</h4>
            <p id="money-plus">Rp 0</p>
        </div>
        <div class="expense">
            <h4>Pengeluaran</h4>
            <p id="money-minus">Rp 0</p>
        </div>
    </div>

    <h3>Riwayat Transaksi</h3>
    <ul id="list" class="list"></ul>

    <h3>Tambah Transaksi Baru</h3>
    <form id="form" onsubmit="addTransaction(event)">
        <div class="form-control">
            <label for="text">Keterangan</label>
            <input type="text" id="text" placeholder="Contoh: Gaji, Beli Makanan..." required />
        </div>
        <div class="form-control">
            <label for="amount">Nominal (Gunakan tanda minus (-) untuk pengeluaran)</label>
            <input type="number" id="amount" placeholder="Contoh: 50000 atau -15000" required />
        </div>
        <button type="btn">Tambah Transaksi</button>
    </form>
</div>

<script>
    const balance = document.getElementById('balance');
    const moneyPlus = document.getElementById('money-plus');
    const moneyMinus = document.getElementById('money-minus');
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const text = document.getElementById('text');
    const amount = document.getElementById('amount');

    let transactions = [];

    function formatRupiah(number) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
    }

    function addTransaction(e) {
        e.preventDefault();

        if (text.value.trim() === '' || amount.value.trim() === '') {
            alert('Mohon isi keterangan dan nominal!');
            return;
        }

        const transaction = {
            id: generateID(),
            text: text.value,
            amount: +amount.value
        };

        transactions.push(transaction);
        addTransactionDOM(transaction);
        updateValues();
        
        text.value = '';
        amount.value = '';
    }

    function generateID() {
        return Math.floor(Math.random() * 100000000);
    }

    function addTransactionDOM(transaction) {
        const sign = transaction.amount < 0 ? '-' : '+';
        const item = document.createElement('li');

        item.classList.add(transaction.amount < 0 ? 'minus' : 'plus');

        item.innerHTML = `
            ${transaction.text} <span>${sign} ${formatRupiah(Math.abs(transaction.amount))}</span>
            <button class="delete-btn" onclick="removeTransaction(${transaction.id})">x</button>
        `;

        list.appendChild(item);
    }

    function updateValues() {
        const amounts = transactions.map(transaction => transaction.amount);
        const total = amounts.reduce((acc, item) => (acc += item), 0);
        
        const income = amounts
            .filter(item => item > 0)
            .reduce((acc, item) => (acc += item), 0);

        const expense = (
            amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1
        );

        balance.innerText = formatRupiah(total);
        moneyPlus.innerText = formatRupiah(income);
        moneyMinus.innerText = formatRupiah(-expense);
    }

    function removeTransaction(id) {
        transactions = transactions.filter(transaction => transaction.id !== id);
        init();
    }

    function init() {
        list.innerHTML = '';
        transactions.forEach(addTransactionDOM);
        updateValues();
    }

    init();
</script>

</body>
</html>
